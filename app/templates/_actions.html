{% set main = b.formats[0] if b.formats else none %}
<button type="button" class="btn kindle" data-kindle="{{ b.id }}"
        {% if not b.kindle_format %}disabled title="Solo hay {{ b.formats|map(attribute='format')|join(', ') }}: Send to Kindle necesita EPUB o PDF"{% endif %}>
  <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm1 3v12h10V5zm3 14v1h4v-1z"/></svg>
  <span>Enviar al Kindle</span>
</button>
{% if main %}
<a class="btn ghost" href="/descargar/{{ main.file_id }}" data-download="{{ main.file_id }}"
   title="Descargar {{ main.format|upper }} ({{ main.size|size }})">
  <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M11 3h2v9.6l3.3-3.3 1.4 1.4L12 16.4l-5.7-5.7 1.4-1.4 3.3 3.3zM5 19h14v2H5z"/></svg>
  <span>{{ main.format|upper }}</span>
</a>
{% endif %}
