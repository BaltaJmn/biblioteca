services:
  biblioteca:
    build: .
    image: biblioteca:latest
    container_name: biblioteca
    restart: unless-stopped
    env_file: .env
    volumes:
      - biblioteca-data:/data
    ports:
      # Solo desde el propio mini PC: desde fuera se entra por Cloudflare (túnel + Access).
      - "127.0.0.1:8080:8080"
      # Sin 6881 publicado y sin UPnP (TORRENT_UPNP=false en .env, usuario 27-10): no acepta conexiones de fuera ni
      # pide al router que la abra. Descarga igual, por conexiones salientes.

  # Publica la web en https://biblioteca.baltajmn.dev sin abrir puertos en el router.
  # Se activa con COMPOSE_PROFILES=tunnel en el .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: biblioteca-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - biblioteca

volumes:
  biblioteca-data:
